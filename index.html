<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ops">
<title>Daily Ops</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0A0E13; --panel:#10161E; --panel-2:#151D28; --line:#202B38; --line-2:#2B3848;
    --text:#E9EEF3; --text-dim:#8E9DAE; --accent:#F2B84B; --accent-ink:#1A1305;
    --glow:rgba(242,184,75,.10); --dots:rgba(255,255,255,.045);
    --c-k8s:#6EA8FE; --c-iac:#B794F6; --c-cicd:#5FD3A5; --c-aws:#FF9F5A;
    --c-platform:#F472B6; --c-sec:#F26D6D; --c-ai:#4FD8E8;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
    --radius:16px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink:#F4F2ED; --panel:#FFFFFF; --panel-2:#F8F6F1; --line:#E3DED3; --line-2:#D3CDBF;
      --text:#1A2028; --text-dim:#5E6875; --accent:#A56A0E; --accent-ink:#FFFFFF;
      --glow:rgba(165,106,14,.10); --dots:rgba(0,0,0,.055);
      --c-k8s:#2563C9; --c-iac:#7442C8; --c-cicd:#127A56; --c-aws:#C2560C;
      --c-platform:#C0307A; --c-sec:#C23030; --c-ai:#0B7F92;
    }
  }
  :root[data-theme="light"] {
    --ink:#F4F2ED; --panel:#FFFFFF; --panel-2:#F8F6F1; --line:#E3DED3; --line-2:#D3CDBF;
    --text:#1A2028; --text-dim:#5E6875; --accent:#A56A0E; --accent-ink:#FFFFFF;
    --glow:rgba(165,106,14,.10); --dots:rgba(0,0,0,.055);
    --c-k8s:#2563C9; --c-iac:#7442C8; --c-cicd:#127A56; --c-aws:#C2560C;
    --c-platform:#C0307A; --c-sec:#C23030; --c-ai:#0B7F92;
  }
  [data-cat="k8s"] { --c:var(--c-k8s); }
  [data-cat="iac"] { --c:var(--c-iac); }
  [data-cat="cicd"] { --c:var(--c-cicd); }
  [data-cat="aws"] { --c:var(--c-aws); }
  [data-cat="platform"] { --c:var(--c-platform); }
  [data-cat="sec"] { --c:var(--c-sec); }
  [data-cat="ai"] { --c:var(--c-ai); }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px); }
  body {
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(70% 38% at 50% -8%, var(--glow), transparent 70%),
      radial-gradient(var(--dots) 1px, transparent 1px) 0 0 / 22px 22px;
  }
  .wrap { position:relative; z-index:1; }

  /* top bar */
  .topbar {
    position:sticky; top:0; z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
    background:color-mix(in srgb, var(--ink) 82%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .brand .logo {
    width:26px; height:26px; border-radius:7px; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:800;
  }
  .brand b { color:var(--accent); font-weight:600; }
  .date { font-family:var(--mono); font-size:11.5px; color:var(--text-dim); margin-right:10px; }
  .top-actions { display:flex; align-items:center; }
  .icon-btn {
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--panel);
    color:var(--text-dim); font-size:15px; cursor:pointer; display:grid; place-items:center;
  }
  .icon-btn:active { transform:scale(.94); }

  .app { max-width:560px; margin:0 auto; padding:20px 18px 56px; }

  /* hero */
  .hero {
    position:relative; border-radius:var(--radius); padding:20px 18px 18px;
    border:1px solid var(--line);
    background:
      radial-gradient(120% 70% at 0% 0%, color-mix(in srgb, var(--c) 17%, transparent), transparent 62%),
      var(--panel);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.55);
    overflow:hidden; touch-action:pan-y;
  }
  .hero::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(var(--c), color-mix(in srgb, var(--c) 10%, transparent));
  }
  .hero-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .badge {
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; font-weight:600;
    color:var(--c); padding:5px 10px; border-radius:999px;
    background:color-mix(in srgb, var(--c) 13%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 30%, transparent);
  }
  .badge i { width:6px; height:6px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
  .pos { font-family:var(--mono); font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
  .today-pill {
    font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent-ink); background:var(--accent); border-radius:5px; padding:2px 6px;
  }
  .back-today {
    font-family:var(--mono); font-size:10.5px; color:var(--accent); background:none; border:none; padding:2px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .prompt { font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:4px; }
  .prompt span { color:var(--c); }
  .title {
    font-family:var(--mono); font-weight:800; margin:0 0 10px; line-height:1.08; letter-spacing:-.035em;
    font-size:clamp(28px, 8.6vw, 40px); overflow-wrap:anywhere;
  }
  .cursor { display:inline-block; width:.5em; height:.09em; margin-left:.12em; background:var(--c); vertical-align:baseline; animation:blink 1.1s steps(2,start) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  .tagline { font-size:17px; line-height:1.45; color:var(--text-dim); margin:0 0 20px; }

  .block { padding:14px 0 0; border-top:1px dashed var(--line-2); margin-top:14px; }
  .block h2 {
    font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:var(--c); margin:0 0 7px;
  }
  .block p { margin:0; font-size:15.5px; line-height:1.62; }

  .actions { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px; font-weight:700;
    color:var(--accent-ink); background:var(--accent); text-decoration:none; border-radius:11px; padding:12px 16px; min-height:44px;
  }
  .btn:active { transform:scale(.97); }
  .nav { display:flex; gap:8px; }
  .nav button {
    width:44px; height:44px; border-radius:11px; border:1px solid var(--line-2); background:var(--panel-2);
    color:var(--text); font-size:17px; cursor:pointer;
  }
  .nav button:active { transform:scale(.94); background:var(--line); }
  .hint { text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); margin:10px 0 0; opacity:.8; }

  /* feed */
  .feed-head { display:flex; align-items:baseline; justify-content:space-between; margin:34px 0 12px; }
  .feed-head h3 { margin:0; font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .feed-head h3 span { color:var(--accent); }
  .updated { font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .chips {
    display:flex; gap:8px; overflow-x:auto; margin:0 -18px 14px; padding:2px 18px 6px;
    scrollbar-width:none; scroll-snap-type:x proximity;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; scroll-snap-align:start; display:inline-flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:12px; color:var(--text-dim); background:var(--panel);
    border:1px solid var(--line); border-radius:999px; padding:0 13px; height:36px; cursor:pointer; white-space:nowrap;
  }
  .chip i { width:7px; height:7px; border-radius:50%; background:var(--c, var(--text-dim)); }
  .chip[aria-pressed="true"] {
    color:var(--text); border-color:color-mix(in srgb, var(--c, var(--accent)) 60%, transparent);
    background:color-mix(in srgb, var(--c, var(--accent)) 14%, var(--panel)); font-weight:600;
  }
  .chip:active { transform:scale(.96); }

  .feed { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .feed li { border-radius:13px; background:var(--panel); border:1px solid var(--line); overflow:hidden; }
  .feed a { position:relative; display:flex; align-items:flex-start; gap:12px; padding:13px 14px 13px 17px; color:var(--text); text-decoration:none; }
  .feed a::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
  .feed a:active { background:var(--panel-2); }
  .feed .body { flex:1; min-width:0; }
  .feed .t { font-size:15px; line-height:1.38; font-weight:600; overflow-wrap:anywhere; }
  .feed .m { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:7px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .feed .src { color:var(--c); font-weight:600; }
  .feed .kind {
    font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:1px 6px; border-radius:4px;
    border:1px solid var(--line-2); color:var(--text-dim);
  }
  .feed .arrow { color:var(--text-dim); font-size:15px; padding-top:2px; }
  .empty { padding:22px 16px; text-align:center; color:var(--text-dim); font-size:14px; line-height:1.6; }
  .empty code { font-family:var(--mono); font-size:12.5px; color:var(--accent); }

  footer { text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:30px; line-height:1.7; }

  /* entrance */
  .rise { opacity:0; transform:translateY(10px); animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .swap { animation:swap .32s cubic-bezier(.2,.7,.2,1); }
  @keyframes swap { from { opacity:.0; transform:translateX(var(--dx,14px)); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .swap { animation:none; opacity:1; transform:none; }
    .cursor { animation:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand"><span class="logo">$_</span><span>daily_ops<b>.sh</b></span></div>
      <div class="top-actions"><span class="date" id="dateLabel"></span><button class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></div>
    </div>
  </header>

  <main class="app">
    <section class="hero rise" id="hero">
      <div class="hero-top">
        <span class="badge"><i></i><span id="catLabel"></span></span>
        <span class="pos"><span id="todayPill" class="today-pill">today</span><button id="backToday" class="back-today" hidden>back to today</button><span id="posLabel"></span></span>
      </div>
      <div class="prompt"><span>$</span> explain</div>
      <h1 class="title"><span id="nameLabel"></span><span class="cursor"></span></h1>
      <p class="tagline" id="taglineLabel"></p>

      <div class="block"><h2>What it is</h2><p id="whatLabel"></p></div>
      <div class="block"><h2>Problem it solves</h2><p id="problemLabel"></p></div>

      <div class="actions">
        <a class="btn" id="linkBtn" target="_blank" rel="noopener noreferrer">Official site <span>↗</span></a>
        <div class="nav"><button id="prevBtn" aria-label="Previous tool">←</button><button id="nextBtn" aria-label="Next tool">→</button></div>
      </div>
    </section>
    <p class="hint">swipe the card or use the arrows to browse all tools</p>

    <div class="feed-head rise" style="animation-delay:.12s">
      <h3><span>&gt;</span> new this week</h3>
      <span class="updated" id="updatedLabel"></span>
    </div>
    <div class="chips rise" id="chips" style="animation-delay:.16s"></div>
    <ul class="feed rise" id="feed" style="animation-delay:.2s"></ul>

    <footer>spotlight rotates daily · feed refreshes weekly<br>headlines link to the original source</footer>
  </main>
</div>

<script>
const CATS = {
  k8s:"kubernetes", iac:"iac", cicd:"ci/cd & gitops", aws:"aws security",
  platform:"platform eng", sec:"ebpf & supply chain", ai:"ai in devops"
};

const LIB = [
{ cat:"iac", name:"crossplane", tagline:"Turn your Kubernetes cluster into a control plane for cloud infrastructure.",
  what:"Crossplane is a CNCF project that extends Kubernetes with custom resources for cloud services, so you can declare an S3 bucket or an RDS database the same way you declare a Deployment.",
  problem:"Terraform and Kubernetes usually live in separate workflows with separate state. Crossplane puts both under one API and a continuous reconciliation loop, and platform teams can publish simple self-service abstractions on top.",
  url:"https://www.crossplane.io/" },
{ cat:"iac", name:"opentofu", tagline:"A community-run, open source fork of Terraform.",
  what:"OpenTofu is a Linux Foundation project forked from Terraform after HashiCorp moved Terraform to the Business Source License. It reads the same HCL and works with the same providers.",
  problem:"Teams that want a fully open source licence, or want to avoid vendor lock-in, can switch with minimal changes. It also adds features of its own, such as native state encryption.",
  url:"https://opentofu.org/" },
{ cat:"iac", name:"pulumi", tagline:"Infrastructure as code in real programming languages.",
  what:"Pulumi lets you define cloud infrastructure in TypeScript, Python, Go, C# or Java instead of a domain-specific language.",
  problem:"Loops, functions, tests and package reuse that are awkward in HCL or YAML are just normal code, which helps when infrastructure logic gets complex.",
  url:"https://www.pulumi.com/" },
{ cat:"cicd", name:"argo_rollouts", tagline:"Canary and blue-green deployments for Kubernetes, with automated analysis.",
  what:"Argo Rollouts replaces the plain Deployment with a Rollout resource that shifts traffic gradually and can check metrics at each step.",
  problem:"A standard Deployment only does rolling updates with no traffic control. Rollouts can stop and roll back a bad release automatically, based on real metrics, before everyone is affected.",
  url:"https://argoproj.github.io/rollouts/" },
{ cat:"cicd", name:"kargo", tagline:"Promote releases across environments the GitOps way.",
  what:"Kargo, from the creators of Argo CD, tracks new container images or config and promotes them stage by stage (dev, staging, prod) by committing to Git.",
  problem:"GitOps tools sync what is in Git but do not say how a change moves from one environment to the next. Kargo models that pipeline explicitly instead of relying on hand-written CI scripts.",
  url:"https://kargo.io/" },
{ cat:"cicd", name:"dagger", tagline:"CI/CD pipelines you can run identically on your laptop and in CI.",
  what:"Dagger runs pipelines as containerised steps defined in code (Go, Python, TypeScript and others) on a BuildKit-based engine.",
  problem:"Pipelines written in provider-specific YAML cannot be run or debugged locally and are hard to move between CI systems. Dagger makes the pipeline portable and testable.",
  url:"https://dagger.io/" },
{ cat:"k8s", name:"karpenter", tagline:"Node provisioning that reacts to pending pods.",
  what:"Karpenter watches for pods that cannot be scheduled and launches right-sized nodes directly, then removes them when they are no longer needed.",
  problem:"Cluster Autoscaler scales fixed node groups, which tends to waste capacity. Karpenter picks instance types per workload and consolidates underused nodes to cut cost and scheduling delay.",
  url:"https://karpenter.sh/" },
{ cat:"k8s", name:"gateway_api", tagline:"The successor to Ingress for routing traffic into a cluster.",
  what:"Gateway API is a Kubernetes standard that splits traffic routing into roles: infrastructure teams own Gateways, app teams own routes such as HTTPRoute.",
  problem:"Ingress is limited and leans on controller-specific annotations that do not carry between implementations. Gateway API gives portable, more expressive routing (header matching, traffic splitting) and cleaner ownership boundaries.",
  url:"https://gateway-api.sigs.k8s.io/" },
{ cat:"k8s", name:"opencost", tagline:"Cost visibility per namespace, workload and label.",
  what:"OpenCost is a CNCF project that measures Kubernetes spend and breaks it down by namespace, deployment or label, using cloud billing data.",
  problem:"A cloud bill shows nodes, not which team or service used them. OpenCost attributes cost to workloads so teams can find waste and charge back accurately.",
  url:"https://www.opencost.io/" },
{ cat:"sec", name:"kyverno", tagline:"Kubernetes policy as plain YAML, with no new language to learn.",
  what:"Kyverno is a policy engine for Kubernetes that validates, mutates and generates resources using YAML policies.",
  problem:"Writing Rego for OPA Gatekeeper takes time to learn. Kyverno lets platform teams enforce rules such as no latest tags or required resource limits in the same YAML format they already use.",
  url:"https://kyverno.io/" },
{ cat:"sec", name:"cilium", tagline:"eBPF-based networking, observability and security.",
  what:"Cilium uses eBPF in the Linux kernel to handle Kubernetes networking, network policy and traffic visibility, and can replace kube-proxy.",
  problem:"iptables-based networking slows down and gets hard to debug as clusters grow. Cilium's eBPF datapath scales better and, with Hubble, shows which services talk to which.",
  url:"https://cilium.io/" },
{ cat:"sec", name:"tetragon", tagline:"Runtime security enforcement with eBPF.",
  what:"Tetragon, from the Cilium project, watches process execution, file access and network activity at the kernel level and can block actions in real time.",
  problem:"Alerting after an attack has happened is often too late. Tetragon's in-kernel enforcement can stop a suspicious action as it occurs, with low overhead because it needs no sidecars.",
  url:"https://tetragon.io/" },
{ cat:"sec", name:"falco", tagline:"Runtime threat detection for containers and hosts.",
  what:"Falco, a CNCF project, watches system calls and flags suspicious behaviour such as a shell opening inside a container or a sensitive file being read.",
  problem:"Image scanning only finds known vulnerabilities before deployment. Falco catches what happens while the workload is running.",
  url:"https://falco.org/" },
{ cat:"sec", name:"trivy", tagline:"One scanner for images, IaC, secrets and dependencies.",
  what:"Trivy scans container images, filesystems, Git repos, Kubernetes manifests and Terraform for vulnerabilities, misconfigurations, secrets and licences.",
  problem:"Teams often run several separate scanners. Trivy covers the common checks in one tool that is easy to drop into GitHub Actions.",
  url:"https://trivy.dev/" },
{ cat:"sec", name:"sigstore", tagline:"Sign and verify artifacts without managing keys.",
  what:"Sigstore (cosign, Fulcio, Rekor) signs container images and other artifacts using short-lived certificates tied to an identity such as your GitHub Actions workflow, and records signatures in a public transparency log.",
  problem:"Long-lived signing keys are hard to store and rotate safely. Keyless signing lets you prove an image was built by a specific pipeline and verify it at deploy time.",
  url:"https://www.sigstore.dev/" },
{ cat:"sec", name:"slsa", tagline:"A framework for trusting how software was built.",
  what:"SLSA (pronounced salsa) defines levels of build integrity, from basic provenance up to hardened, tamper-resistant build platforms.",
  problem:"Supply-chain attacks target the build process rather than the code. SLSA gives a common checklist and attestation format to show an artifact came from the expected source and builder.",
  url:"https://slsa.dev/" },
{ cat:"platform", name:"backstage", tagline:"A developer portal framework, originally from Spotify.",
  what:"Backstage is a CNCF project for building an internal portal with a software catalogue, project templates and docs, extended through plugins.",
  problem:"As teams multiply, nobody knows who owns a service or how to start a new one. Backstage centralises ownership, docs and golden-path templates, though it usually only pays for its upkeep in larger organisations.",
  url:"https://backstage.io/" },
{ cat:"platform", name:"score", tagline:"One workload spec that works across environments.",
  what:"Score is a CNCF sandbox spec where developers describe what a workload needs (a container, a database, a route) in one small YAML file, and tooling turns it into Docker Compose or Kubernetes manifests.",
  problem:"Developers should not write different config for local and production. Score keeps their input simple while the platform team decides how things are provisioned.",
  url:"https://score.dev/" },
{ cat:"ai", name:"k8sgpt", tagline:"An AI assistant that explains cluster problems.",
  what:"K8sGPT scans a Kubernetes cluster for issues such as failing pods and misconfigured services, then uses an LLM to explain them in plain language with suggested fixes.",
  problem:"Kubernetes error messages are terse. K8sGPT shortens the step from something is red to here is why, and can use a local model if data cannot leave the cluster.",
  url:"https://k8sgpt.ai/" },
{ cat:"ai", name:"model_context_protocol", tagline:"A standard way to connect AI assistants to your tools.",
  what:"The Model Context Protocol (MCP) is an open standard that lets AI assistants call external tools and read data through a common interface. Vendors publish MCP servers for things like Kubernetes, GitHub and AWS.",
  problem:"Every AI tool used to need its own custom integration. MCP lets one server work with many assistants, which is why it is showing up in DevOps tooling for querying clusters or pipelines in plain language. Be careful what write access you grant.",
  url:"https://modelcontextprotocol.io/" },
{ cat:"aws", name:"guardduty_extended_threat_detection", tagline:"Attack sequences instead of isolated alerts.",
  what:"GuardDuty can correlate signals across CloudTrail, VPC flow logs, EKS and runtime data into a single attack-sequence finding rather than separate alerts.",
  problem:"Individual findings are easy to miss or dismiss. Seeing the sequence, such as credential theft followed by unusual API calls, makes real incidents easier to spot and prioritise.",
  url:"https://aws.amazon.com/guardduty/" },
{ cat:"aws", name:"iam_access_analyzer_unused_access", tagline:"Find permissions nobody uses and trim them.",
  what:"Access Analyzer reports IAM roles, users and permissions that have not been used within a window you set, and can generate a policy based on actual CloudTrail activity.",
  problem:"Over-broad IAM permissions pile up over time. Unused-access findings and generated least-privilege policies give you evidence for what to remove.",
  url:"https://aws.amazon.com/iam/access-analyzer/" },
{ cat:"aws", name:"cloudtrail_lake", tagline:"SQL queries over your audit logs, without the Athena setup.",
  what:"CloudTrail Lake stores CloudTrail events in a managed event data store you can query with SQL, with no S3 and Athena plumbing to build.",
  problem:"Investigating who did what normally means setting up Athena over S3 logs. Lake turns an audit question into a single query.",
  url:"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake.html" }
];

/* ---------- spotlight ---------- */
const now = new Date();
const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
const todayIdx = doy % LIB.length;
let idx = todayIdx;
const $ = (id) => document.getElementById(id);
const hero = $('hero');
$('dateLabel').textContent = now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

function showTool(dir) {
  const t = LIB[idx];
  hero.setAttribute('data-cat', t.cat);
  $('catLabel').textContent = CATS[t.cat];
  $('nameLabel').textContent = t.name;
  $('taglineLabel').textContent = t.tagline;
  $('whatLabel').textContent = t.what;
  $('problemLabel').textContent = t.problem;
  $('linkBtn').href = t.url;
  $('posLabel').textContent = String(idx + 1).padStart(2, '0') + ' / ' + String(LIB.length).padStart(2, '0');
  const isToday = idx === todayIdx;
  $('todayPill').hidden = !isToday;
  $('backToday').hidden = isToday;
  if (dir) {
    hero.style.setProperty('--dx', (dir > 0 ? 16 : -16) + 'px');
    hero.classList.remove('swap'); void hero.offsetWidth; hero.classList.add('swap');
  }
}
function step(d) { idx = (idx + d + LIB.length) % LIB.length; showTool(d); }
$('prevBtn').addEventListener('click', () => step(-1));
$('nextBtn').addEventListener('click', () => step(1));
$('backToday').addEventListener('click', () => { idx = todayIdx; showTool(1); });

let sx = 0, sy = 0;
hero.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
hero.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
}, { passive:true });
showTool(0);

/* ---------- weekly feed ---------- */
const feedEl = $('feed'), chipsEl = $('chips');
let items = [], active = 'all';

function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
function ago(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd ago';
  if (days < 30) return Math.floor(days / 7) + 'w ago';
  return Math.floor(days / 30) + 'mo ago';
}
function renderChips() {
  chipsEl.innerHTML = '';
  [['all','all'], ...Object.entries(CATS)].forEach(([key, label]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    if (key !== 'all') b.setAttribute('data-cat', key);
    if (key !== 'all') { const i = document.createElement('i'); b.appendChild(i); }
    b.appendChild(document.createTextNode(label));
    b.setAttribute('aria-pressed', String(active === key));
    b.addEventListener('click', () => { active = key; renderChips(); renderFeed(); });
    chipsEl.appendChild(b);
  });
}
function renderFeed() {
  feedEl.innerHTML = '';
  const list = items.filter(i => active === 'all' || i.category === active);
  if (!list.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    if (items.length) li.textContent = 'Nothing in this category this week.';
    else li.innerHTML = 'No feed items yet.<br>Run the <code>Update feed</code> workflow from your repo\u2019s Actions tab.';
    feedEl.appendChild(li);
    return;
  }
  list.forEach(i => {
    const li = document.createElement('li');
    li.setAttribute('data-cat', i.category);
    const a = document.createElement('a');
    a.href = safeUrl(i.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
    const body = document.createElement('div'); body.className = 'body';
    const tt = document.createElement('div'); tt.className = 't'; tt.textContent = i.title;
    const m = document.createElement('div'); m.className = 'm';
    const src = document.createElement('span'); src.className = 'src'; src.textContent = i.source;
    const dt = document.createElement('span'); dt.textContent = ago(i.date);
    const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = i.kind === 'release' ? 'release' : 'news';
    m.append(src, dt, kind);
    body.append(tt, m);
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '\u2197';
    a.append(body, arrow); li.appendChild(a); feedEl.appendChild(li);
  });
}
renderChips();
fetch('feed.json', { cache:'no-cache' })
  .then(r => r.json())
  .then(d => {
    items = Array.isArray(d.items) ? d.items : [];
    $('updatedLabel').textContent = d.updated ? 'updated ' + d.updated : '';
    renderFeed();
  })
  .catch(() => { $('updatedLabel').textContent = 'offline'; renderFeed(); });

/* ---------- theme ---------- */
$('themeToggle').addEventListener('click', () => {
  const root = document.documentElement, cur = root.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});

/* ---------- offline ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
